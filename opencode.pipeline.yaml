version: 1
name: nightly-release

description: Lint, test and build the repository every night after the last commit.

defaults:
  timeoutSeconds: 1800
  retryCount: 1
  retryDelay: 120
  allowedTools: [read, edit, glob, grep]

steps:
  - id: lint
    schedule: "0 2 * * *"
    prompt: >
      Inspect the linter configuration and the changed files, list likely lint
      problems and prepare style-only fixes. Do not change behaviour. The quality
      gate runs `npm run lint` itself; this step has no shell tool.
    qualityGate: npm run lint

  - id: test
    needs: [lint]
    trigger: dag
    prompt: >
      Analyze the test sources and available failure artifacts, identify likely
      causes and prepare fixes with regression tests. The quality gate runs
      `npm test` itself; this step has no shell tool.
    qualityGate: npm test

  - id: build
    needs: [test]
    trigger: dag
    timeoutSeconds: 3600
    prompt: >
      Review the build configuration and expected dist/ entry points, then report
      what the build should produce. The quality gate runs `npm run build` itself;
      this step has no shell tool.
    qualityGate: npm run build
