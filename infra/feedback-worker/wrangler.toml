name = "agent-steward-feedback"
main = "worker.js"
compatibility_date = "2025-01-01"

# Деталь 3.8 (F-2.5). Создайте KV-пространства и подставьте их ID:
#   npx wrangler kv namespace create FEEDBACK_DEDUP
#   npx wrangler kv namespace create FEEDBACK_RATELIMIT
[[kv_namespaces]]
binding = "FEEDBACK_DEDUP"
id = "REPLACE_WITH_DEDUP_KV_ID"

[[kv_namespaces]]
binding = "FEEDBACK_RATELIMIT"
id = "REPLACE_WITH_RATELIMIT_KV_ID"

# Секрет PAT с правом issues:write на репозиторий автора:
#   npx wrangler secret put GITHUB_TOKEN
# увидеть/удалить:
#   npx wrangler secret list
#   npx wrangler secret delete GITHUB_TOKEN
