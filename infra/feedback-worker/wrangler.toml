name = "agent-steward-feedback"
main = "worker.js"
compatibility_date = "2025-01-01"

# Деталь 3.8 (F-2.5). KV-привязки опциональны: без них воркер использует
# in-memory хранилища для дедупа по reportId и rate-limit по IP (сбрасываются
# при рестарте изолята). Для персистентности создайте пространства и
# раскомментируйте блоки ниже, подставив выданные Wrangler ID:
#   npx wrangler kv namespace create FEEDBACK_DEDUP
#   npx wrangler kv namespace create FEEDBACK_RATELIMIT
# [[kv_namespaces]]
# binding = "FEEDBACK_DEDUP"
# id = "..."
# [[kv_namespaces]]
# binding = "FEEDBACK_RATELIMIT"
# id = "..."

# Секрет PAT с правом issues:write на репозиторий автора:
#   npx wrangler secret put GITHUB_TOKEN
# увидеть/удалить:
#   npx wrangler secret list
#   npx wrangler secret delete GITHUB_TOKEN
