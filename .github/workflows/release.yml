name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# B16: workflow по умолчанию только читает репозиторий. Права на запись
# (contents) и на OIDC-подпись (id-token) выдаются точечно — только job'у,
# который реально публикует релиз. Verify и dry-run в них не нуждаются.
permissions:
  contents: read

jobs:
  # P3-5: тег не проходит через обычный CI (он слушает только ветки и PR),
  # поэтому релиз сам прогоняет тесты. macOS покрыт обычным CI на каждом push
  # (ci.yml, matrix windows/ubuntu/macos), в релизе не дублируется: очередь
  # macOS-раннеров блокировала publish. Публикация стартует после зелёного verify.
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      - name: Test
        run: npm run test:parallel

      # Локальные тесты отдельно: ловят сломанный перевод до публикации.
      # Достаточно одного прогона на ubuntu — строки локалей от ОС не зависят.
      - name: Test in English locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:en

      - name: Test in Chinese locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:zh

  publish:
    name: Publish to npm
    needs: verify
    # B16.1: публикация — только из push по тегу v*. Проверка event_name
    # обязательна: workflow_dispatch тоже умеет запускаться на ref тега, и без
    # неё ручной запуск мог бы опубликовать пакет.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # B16.2: единственная job с правом записи в репозиторий (GitHub Release)
    # и с правом на OIDC-токен для npm Trusted Publishing. Job-level
    # permissions заменяют workflow-level, поэтому contents перечислен снова.
    permissions:
      contents: write
      id-token: write
    # Публикация после зелёной матрицы: сборка + npm publish, без повторного
    # прогона всех сюит (он уже выполнен в verify).
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Older bundled npm versions fail
      # with a misleading E404 on `npm publish` (npm/cli#9088), so upgrade first.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      # P3-28: publishing uses npm Trusted Publishing (OIDC) only. Configure
      # the trusted publisher on npmjs.com for this repository and the
      # `release.yml` workflow; no NPM_TOKEN secret is needed or read. Token
      # publishing is being restricted by npm, and requiring OIDC here makes
      # the release path reproducible and signed with provenance.
      - name: Publish (trusted publishing / OIDC)
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # MCP Registry: публикуем server.json только после npm publish, иначе реестр
  # не сможет сверить имя с полем mcpName в уже опубликованном пакете.
  # OIDC-логин привязан к io.github.deadsno/* — пространство имён из server.json.
  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Зеркало npm иногда отстаёт от OIDC-публикации (см. релиз 0.0.9),
      # поэтому ждём появления версии, прежде чем отдавать её реестру.
      - name: Wait for npm package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if npm view "agent-steward@$VERSION" version >/dev/null 2>&1; then
              echo "agent-steward@$VERSION is available in npm"
              exit 0
            fi
            echo "Waiting for npm registry ($i/30)..."
            sleep 10
          done
          echo "::error::agent-steward@$VERSION did not appear in npm registry"
          exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        shell: bash
        run: ./mcp-publisher validate

      - name: Login to MCP Registry (GitHub OIDC)
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        shell: bash
        run: ./mcp-publisher publish

  # B16.4: ручной запуск — это проверка релиза, а не релиз. Job собирает пакет
  # и проверяет упаковку через `npm pack --dry-run`: ошибки манифеста и состава
  # files видны, в npm ничего не уходит. Прав на запись у неё нет.
  dry-run:
    name: Dry-run npm publish
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      # `npm publish --dry-run` не годится для повторяемой ручной проверки: он
      # тоже ходит в реестр и падает, если версия уже опубликована. `npm pack
      # --dry-run` проверяет ровно то, что нужно перед тегом, — манифест,
      # `files`, размеры и итоговый tarball, — не обращаясь к npm.
      - name: Pack dry-run
        run: npm pack --dry-run
