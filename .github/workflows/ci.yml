name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # T-14: пин 22.22.0 фиксирует нижнюю границу из engines (node:sqlite).
        # Без пина "22" резолвится в последний 22.x — обычно НОВЕЕ минимума,
        # но версия плавает и нижняя граница остаётся непроверенной.
        node: ["22.22.0", 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore incremental build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-node${{ matrix.node }}-build-${{ hashFiles('tsconfig.json', 'vite.config.ts', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-build-${{ hashFiles('tsconfig.json', 'vite.config.ts', 'package-lock.json') }}-
            ${{ runner.os }}-node${{ matrix.node }}-build-

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      # P-1.3: упаковка проверяется на всех трёх ОС матрицы — subpath-артефакты
      # и доки обязаны попадать в tarball независимо от платформы.
      - name: Verify package contents
        run: npm pack --dry-run

      - name: Test
        run: npm run test:parallel

      # P3-2: ESLint — информационный шаг: выход 0 даже при warnings (PL-22).
      # QA-A2.7: эпик типизации закрыт, реальный гейт — строгий линтер ниже.
      - name: Lint (informational)
        run: npm run lint

      # QA-A2.7: baseline-гейт снят — в src/ 0 warning / 0 error, любой warning ломает CI.
      - name: ESLint strict (zero warnings)
        run: npm run lint:strict

      - name: Test in English locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:en

      - name: Test in Chinese locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:zh

  # Д5/З5.4: совместимость с линиями SDK. Эти jobs не входят в матрицу ОС
  # и не блокируют три основные платформы: падение здесь означает регрессию
  # адаптера, а не ОС-специфичную проблему.
  compat-v2:
    name: V2 SDK 2.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Install newest V2 SDK
        run: npm install --no-save @opencode/plugin@2.3.0 @opencode/schema@2.3.0

      - name: Check V2 entrypoint and adapter
        run: |
          node test-dual-entry.mjs
          node test-agent-tools.mjs
          node test-audit.mjs

  compat-v1:
    name: V1 SDK 1.19.x
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Check V1 server() and tools
        run: |
          node test-dual-entry.mjs
          node test-v1-integration.mjs
          node test-docs.mjs

  # P0-1: smoke-проверка, что шим opencode-windows-scheduler ставится
  # в чистую директорию. Ставим локально собранные tarball'ы: установка из
  # registry заблокирована до публикации agent-steward (P0-1.T2.1).
  shim-smoke:
    name: Shim smoke (opencode-windows-scheduler install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack plugin and shim
        run: |
          npm pack --ignore-scripts
          (cd legacy && npm pack --ignore-scripts)

      - name: Install shim in clean directory
        run: |
          mkdir -p /tmp/shim-smoke
          cd /tmp/shim-smoke
          npm init -y >/dev/null 2>&1 || true
          npm install "$GITHUB_WORKSPACE"/agent-steward-*.tgz
          npm install "$GITHUB_WORKSPACE"/legacy/opencode-windows-scheduler-*.tgz
          node -e "
          const fs = require('fs');
          const exists = (p) => fs.existsSync(p);
          const pick = (dep) => exists('node_modules/' + dep) ? 'node_modules/' + dep : 'node_modules/agent-steward/node_modules/' + dep;
          for (const dep of ['@opencode/plugin', '@opencode/schema', 'chokidar', 'zod']) {
            if (!exists(pick(dep))) throw new Error('missing dependency: ' + dep);
          }
          const core = JSON.parse(fs.readFileSync('node_modules/agent-steward/package.json', 'utf8'));
          console.log('shim ok: ' + core.name + '@' + core.version);
          "

  # P3-1: дрейф lock-файла на свежем npm. Ловит плавающие диапазоны (">=") и
  # lock, который перестал соответствовать package.json, до того как это
  # заметит пользователь на чистой установке.
  lockfile-drift:
    name: Lockfile drift (npm@latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use newest npm
        run: npm install -g npm@latest

      - name: Check lock matches package.json
        run: npm ci --dry-run --ignore-scripts

      - name: Check publish payload
        run: npm pack --dry-run --ignore-scripts

