name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # T-14: пин 22.22.0 — engines требует >=22.22.0 (node:sqlite), а "22"
        # резолвится в последний 22.x, который может быть старее.
        node: ["22.22.0", 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build GUI
        run: npm run build:gui

      - name: Test
        run: npm run test:parallel

      - name: Test in English locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:en

      - name: Test in Chinese locale
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:parallel:zh
