name: Nightly chaos

# Спринт 36.5: ночной chaos-тест durable DAG.
# Убивает процесс `kill -9` посреди цепочки шагов и проверяет, что состояние
# в SQLite пережило крах: завершённые шаги не переигрываются, прерванный шаг
# повторяется с attempt + 1, resume доводит запуск до passed.
# Основной CI (ci.yml) этот сценарий не гоняет: он нужен раз в сутки,
# чтобы ловить редкие гонки SQLite/WAL, а не тормозить каждый push.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-chaos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chaos-dag:
    name: Chaos DAG / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Chaos: kill -9 mid-DAG
        run: node test-chaos-dag.mjs
