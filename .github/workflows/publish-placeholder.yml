name: Publish placeholder

# Publishes the reserved-name placeholder package (packages/opencode-pipeline).
# Kept separate from release.yml so the placeholder can be re-published
# (0.0.2, 0.0.3, ...) without touching the main package release flow.
#
# Auth, same two paths as release.yml:
#   1. NPM_TOKEN secret -> token auth.
#   2. No token -> npm Trusted Publisher (OIDC) for this repo + this workflow.

on:
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Directory of the package to publish"
        required: true
        default: "packages/opencode-pipeline"
      dry_run:
        description: "Only run npm publish --dry-run"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish placeholder to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (npm/cli#9088).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Validate package
        working-directory: ${{ inputs.package_dir }}
        run: |
          node -e "const p=require('./package.json'); if (!p.name || !p.version) { console.error('name/version missing'); process.exit(1); } console.log(p.name + '@' + p.version);"

      - name: Publish (NPM_TOKEN)
        if: env.NPM_TOKEN != '' && inputs.dry_run == false
        working-directory: ${{ inputs.package_dir }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish (trusted publishing / OIDC)
        if: env.NPM_TOKEN == '' && inputs.dry_run == false
        working-directory: ${{ inputs.package_dir }}
        run: npm publish --provenance --access public

      - name: Dry run
        if: inputs.dry_run == true
        working-directory: ${{ inputs.package_dir }}
        run: npm publish --dry-run --access public
