# X-4.2: в dependabot.yml нет нативного ключа auto-merge. Minor/patch-PR
# мержуются workflow .github/workflows/dependabot-automerge.yml через
# `gh pr merge --auto --squash` после зелёного ci.yml; major-обновления ручные.
# Дополнительно включите Settings → General → Pull Requests → Allow auto-merge:
# без настройки репозитория workflow не сможет поставить PR в авто-мерж.
# P3-1: обновления зависимостей приходят PR-ами, а не «внезапным» дрейфом лока.
# PR создаются против `dev` (target-branch), чтобы обновления не оседали только в main.
# Группировка держит шум в разумных пределах: один PR на dev-зависимости,
# один на OpenTelemetry, один на парные @opencode/* (plugin + schema),
# остальное — по одному. Мажоры dev-инструментов игнорируются: они требуют
# ручной миграции и не должны приезжать автоматически.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      opencode:
        patterns:
          - "@opencode/*"
      dev-dependencies:
        dependency-type: development
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@opentui/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
